name: Enable GitHub Pages

# 引导工作流: 用 GITHUB_TOKEN 的 pages + administration 写权限启用 Pages 站点。
# 源 = main 分支根目录(纯静态托管, portal.html / app / docs 直接可访问)。
# 之后站点随 main 分支推送自动更新; 若站点已存在则幂等跳过(POST 409 → PUT 校准)。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

concurrency:
  group: pages-bootstrap
  cancel-in-progress: false

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages site (source: main / root, idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "== 尝试创建 Pages 站点 (source: main /) =="
          gh api "repos/${GITHUB_REPOSITORY}/pages" -X POST \
            -f "source[branch]=main" -f "source[path]=/" ; rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "== 创建返回非零(rc=$rc, 多为 409 已存在) → PUT 校准源 =="
            gh api "repos/${GITHUB_REPOSITORY}/pages" -X PUT \
              -f "source[branch]=main" -f "source[path]=/"
          fi
          echo "== 最终 Pages 状态 =="
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status, html_url, source}'
          echo "== 请求一次构建 =="
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds" -X POST \
            --jq '{status, message}' || echo "(构建请求返回非 201, 站点可能已在构建队列)"
